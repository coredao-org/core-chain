name: Go Vulnerability Report

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["master", "develop"]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: 1.23.x
        cache: true
    - name: Run govulncheck
      env:
        GOVULNCHECK: ${{ runner.temp }}/bin/govulncheck
      run: |
        mkdir -p "$(dirname "$GOVULNCHECK")"
        GOBIN="$(dirname "$GOVULNCHECK")" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
        # SARIF mode reports the existing baseline without failing unrelated changes.
        "$GOVULNCHECK" -format sarif ./... > govulncheck.sarif
    - name: Upload vulnerability report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: govulncheck-sarif
        path: govulncheck.sarif
        retention-days: 14
